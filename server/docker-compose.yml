services:
  tts:
    build: .
    restart: unless-stopped
    ports:
      # Наружу на порту 8000. Если ставишь за nginx с HTTPS — замени на "127.0.0.1:8010:8000".
      - "8010:8000"
    environment:
      TTS_TOKEN: ${TTS_TOKEN}
      TORCH_THREADS: "4"
      CACHE_DAYS: "14"
    volumes:
      - ./data:/data
