<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сверка оснащения</title>
<style>
  :root{
    --bg:#F4F6F8;
    --card:#FFFFFF;
    --ink:#16232E;
    --sub:#5B6B77;
    --line:#DDE3E8;
    --accent:#1E4E63;
    --ok:#2F7A5C;
    --ok-bg:#E7F3ED;
    --flag:#B4590E;
    --flag-bg:#FBEEE1;
    --mono: "SFMono-Regular", Consolas, "Roboto Mono", monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding-bottom:40px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--accent); color:#fff;
    padding:14px 16px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  header h1{
    font-size:15px; font-weight:600; margin:0 0 10px; letter-spacing:.2px;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .dot{width:7px;height:7px;border-radius:50%;background:#7FD6B5;display:inline-block;}
  .searchWrap{position:relative;}
  #search{
    width:100%; padding:11px 38px 11px 14px; border-radius:10px; border:none;
    font-size:16px; background:rgba(255,255,255,.95); color:var(--ink);
    outline:none;
  }
  #search::placeholder{color:#8A97A0;}
  .clearBtn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:#8A97A0; font-size:18px; cursor:pointer;
    display:none; padding:4px;
  }
  .progressRow{
    display:flex; gap:10px; margin-top:10px; font-size:12px; color:#CFE3EA;
    align-items:center;
  }
  .bar{flex:1; height:5px; background:rgba(255,255,255,.25); border-radius:3px; overflow:hidden;}
  .barFill{height:100%; background:#7FD6B5; width:0%; transition:width .25s;}
  .stat{white-space:nowrap; font-variant-numeric:tabular-nums;}
  .stat b{color:#fff;}
  .saveStatus{margin-top:6px; font-size:11px; color:#CFE3EA; opacity:.85;}
  .saveStatus.err{color:#FFD3B0;}
  .saveStatus.ok{color:#B7E8D2;}

  main{padding:12px 12px 0;}
  .roomHead{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 4px 6px; cursor:pointer; user-select:none;
  }
  .roomHead .title{font-size:13px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.4px;}
  .roomHead .meta{font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums;}
  .roomNote{
    margin:-2px 4px 8px; font-size:12px; color:var(--flag); background:var(--flag-bg);
    padding:6px 10px; border-radius:8px; display:inline-block;
  }
  .items{display:flex; flex-direction:column; gap:8px; margin-bottom:6px;}
  .roomBody.collapsed{display:none;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 12px 10px; transition:background .15s,border-color .15s;
  }
  .card.done{background:var(--ok-bg); border-color:#BFE0CE;}
  .card.flagged{background:var(--flag-bg); border-color:#E8C39A;}
  .name{font-size:14.5px; font-weight:600; line-height:1.35;}
  .statusRow{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .chip{
    flex:1; min-width:0; padding:7px 6px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:11.5px; color:var(--sub); white-space:nowrap;
  }
  .chip.active-ok{background:var(--ok); border-color:var(--ok); color:#fff; font-weight:600;}
  .chip.active-warn{background:var(--flag); border-color:var(--flag); color:#fff; font-weight:600;}
  .chip.active-bad{background:#A23B3B; border-color:#A23B3B; color:#fff; font-weight:600;}
  .fixBox{margin-top:8px; background:#fff; border:1px dashed #E8C39A; border-radius:8px; padding:8px;}
  .fixBox label{display:block; font-size:11px; color:var(--sub); margin:6px 0 3px;}
  .fixBox label:first-child{margin-top:0;}
  .fixBox input{width:100%; padding:7px 8px; border-radius:6px; border:1px solid var(--line); font-size:13px;}
  .commentBox{
    width:100%; margin-top:8px; padding:8px; border-radius:8px; border:1px solid var(--line);
    font-size:12.5px; min-height:44px; font-family:inherit; resize:vertical;
  }
  .info{margin-top:6px; font-size:12px; color:var(--sub); line-height:1.5;}
  .info .k{color:#8A97A0;}
  .mono{font-family:var(--mono); font-size:11.5px; color:var(--accent); word-break:break-all;}
  .flagNote{
    margin-top:6px; font-size:12px; color:var(--flag); background:var(--flag-bg);
    padding:5px 8px; border-radius:6px;
  }
  .qtyRow{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .qtyRow label{font-size:11.5px; color:var(--sub);}
  .qtyRow input{
    width:52px; padding:5px 6px; border-radius:6px; border:1px solid var(--line);
    font-size:13px; text-align:center;
  }
  .expected{font-size:11.5px; color:var(--sub);}
  .mismatch{color:var(--flag); font-weight:700;}
  details.comp{margin-top:6px;}
  details.comp summary{font-size:11.5px; color:var(--accent); cursor:pointer;}
  details.comp .compList{font-size:11.5px; color:var(--sub); margin-top:4px; line-height:1.5;}

  .empty{text-align:center; color:var(--sub); font-size:13px; padding:40px 20px;}
  .resetBar{
    margin:18px 4px 0; text-align:center;
  }
  .resetBar button{
    background:none; border:1px solid var(--line); color:var(--sub); font-size:12px;
    padding:8px 14px; border-radius:20px; margin:0 4px;
  }
  .print-only{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block; position:absolute; left:0; top:0; width:100%;
      font-family:Georgia,serif; color:#111; padding:10mm;
    }
    #printArea h2{font-size:16px; border-bottom:1px solid #999; padding-bottom:4px; margin-top:18px;}
    #printArea .pItem{font-size:11.5px; margin:6px 0; padding-bottom:6px; border-bottom:1px solid #eee;}
    #printArea .pMatch{color:#1a5c3f;}
    #printArea .pDiff{color:#8a4a00;}
    #printArea .pMiss{color:#8a1a1a;}
  }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>Сверка медицинского оснащения</h1>
  <div class="searchWrap">
    <input id="search" type="text" placeholder="Начните вводить название или номер…" autocomplete="off">
    <button class="clearBtn" id="clearBtn">✕</button>
  </div>
  <div class="progressRow">
    <span class="stat"><b id="doneCount">0</b>/<span id="totalCount">0</span> сверено</span>
    <div class="bar"><div class="barFill" id="barFill"></div></div>
    <span class="stat" id="flagCount"></span>
  </div>
  <div class="saveStatus" id="saveStatus">Проверка сохранения…</div>
</header>

<main id="main"></main>
<div class="resetBar">
  <button id="reportBtn">Отчёт текстом</button>
  <button id="printBtn">Печать / PDF</button>
</div>
<div class="resetBar">
  <button id="exportBtn">Резервный код</button>
  <button id="importBtn">Восстановить по коду</button>
  <button id="resetBtn">Сбросить всё</button>
</div>
<textarea id="backupBox" style="display:none;width:100%;min-height:90px;margin:10px 12px;padding:10px;border-radius:8px;border:1px solid #DDE3E8;font-family:monospace;font-size:11px;" readonly></textarea>
<div id="printArea" class="print-only"></div>

// assign ids
let idc=0;
DATA.forEach(r=>r.items.forEach(it=>{it.id="i"+(idc++);}));

const STATE_KEY="equip-check-state-v1";
let state = {}; // id -> {done:bool, actualQty:number|null}

function setSaveStatus(msg, cls){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = msg;
  el.className = 'saveStatus' + (cls? ' '+cls:'');
}

function saveState(){
  try{
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    const t = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    setSaveStatus('✓ Сохранено в этом браузере · '+t, 'ok');
  }catch(e){
    setSaveStatus('⚠ Не удалось сохранить: '+(e && e.message ? e.message : e), 'err');
    console.error(e);
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if(raw) state = JSON.parse(raw);
    setSaveStatus('Готово к работе · автосохранение включено', 'ok');
  }catch(e){
    setSaveStatus('Пока нет сохранённых данных — начнём с чистого листа.', '');
  }
  render();
}

const collapsedRooms = new Set();

function matchesQuery(item, q){
  if(!q) return true;
  q = q.toLowerCase();
  const hay = [item.name, item.reg||"", item.serial||"", item.code||""].join(" ").toLowerCase();
  return hay.includes(q);
}

function render(){
  const q = document.getElementById('search').value.trim();
  document.getElementById('clearBtn').style.display = q ? 'block' : 'none';
  const main = document.getElementById('main');
  main.innerHTML = "";

  let totalAll=0, doneAll=0, flaggedAll=0;

  DATA.forEach((room, ri)=>{
    const filtered = room.items.filter(it=>matchesQuery(it,q));
    room.items.forEach(it=>{
      totalAll++;
      const st = state[it.id];
      if(st && st.status) doneAll++;
      if(st && (st.status==='different' || st.status==='missing' || st.mismatch)) flaggedAll++;
    });
    if(q && filtered.length===0) return;

    const roomKey = "r"+ri;
    const isCollapsed = collapsedRooms.has(roomKey) && !q;

    const roomDoneCount = room.items.filter(it=>state[it.id]&&state[it.id].status).length;

    const section = document.createElement('div');

    const head = document.createElement('div');
    head.className = 'roomHead';
    head.innerHTML = `<span class="title">${room.room}${room.date? ' · '+room.date:''}</span><span class="meta">${roomDoneCount}/${room.items.length} ▾</span>`;
    head.onclick = ()=>{
      if(collapsedRooms.has(roomKey)) collapsedRooms.delete(roomKey); else collapsedRooms.add(roomKey);
      render();
    };
    section.appendChild(head);

    if(room.note){
      const n = document.createElement('div');
      n.className='roomNote';
      n.textContent = room.note;
      section.appendChild(n);
    }

    const body = document.createElement('div');
    body.className = 'items roomBody' + (isCollapsed? ' collapsed':'');

    filtered.forEach(it=>{
      const st = state[it.id] || {};
      const status = st.status || null;
      const card = document.createElement('div');
      card.className = 'card'
        + (status ? ' done':'')
        + ((status==='different'||status==='missing') ? ' flagged':'');

      const infoBits = [];
      if(it.reg) infoBits.push(`<span class="k">Рег:</span> ${it.reg}`);
      if(it.code) infoBits.push(`<span class="k">Код:</span> ${it.code}`);

      let html = `
        <div class="name">${it.name}</div>
        <div class="info">${infoBits.join(' &nbsp;·&nbsp; ')}</div>`;
      if(it.serial){
        html += `<div class="info mono">Заявлено S/N: ${it.serial}</div>`;
      }
      if(it.flag){
        html += `<div class="flagNote">⚑ ${it.flag}</div>`;
      }

      html += `<div class="statusRow">
          <button class="chip ${status==='match'?'active-ok':''}" data-status="match" data-id="${it.id}">✓ Совпадает</button>
          <button class="chip ${status==='different'?'active-warn':''}" data-status="different" data-id="${it.id}">⇄ Другое</button>
          <button class="chip ${status==='missing'?'active-bad':''}" data-status="missing" data-id="${it.id}">✕ Не приехало</button>
        </div>`;

      if(status==='different'){
        html += `<div class="fixBox">
            <label>Фактическая модель</label>
            <input type="text" data-model="${it.id}" value="${st.actualModel||''}" placeholder="что приехало по факту">
            <label>Фактический серийный номер</label>
            <input type="text" data-serial="${it.id}" value="${st.actualSerial||''}" placeholder="S/N по факту">
          </div>`;
      }

      html += `<div class="qtyRow">
          <span class="expected">Ожидается: <b>${it.qty}</b> ${it.unit}</span>
          <label>Факт:</label>
          <input type="number" min="0" data-qty="${it.id}" value="${st.actualQty!==undefined && st.actualQty!==null ? st.actualQty:''}" placeholder="${it.qty}">
        </div>`;

      if(status){
        html += `<textarea class="commentBox" data-comment="${it.id}" placeholder="Комментарий (необязательно)">${st.comment||''}</textarea>`;
      }

      if(it.components){
        html += `<details class="comp"><summary>Состав комплекта</summary><div class="compList">${it.components}</div></details>`;
      }
      card.innerHTML = html;
      body.appendChild(card);
    });

    section.appendChild(body);
    main.appendChild(section);
  });

  if(q && DATA.every(room=>room.items.filter(it=>matchesQuery(it,q)).length===0)){
    main.innerHTML = `<div class="empty">Ничего не найдено по «${q}».<br>Проверьте название или номер.</div>`;
  }

  document.getElementById('doneCount').textContent = doneAll;
  document.getElementById('totalCount').textContent = totalAll;
  document.getElementById('barFill').style.width = totalAll? (doneAll/totalAll*100)+'%' : '0%';
  document.getElementById('flagCount').textContent = flaggedAll ? flaggedAll+' расхожд.' : '';

  main.querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      const status = el.dataset.status;
      state[id] = state[id] || {};
      state[id].status = (state[id].status === status) ? null : status;
      saveState();
      render();
    };
  });
  main.querySelectorAll('[data-qty]').forEach(el=>{
    el.onchange = ()=>{
      const id = el.dataset.qty;
      state[id] = state[id] || {};
      const val = el.value === '' ? null : Number(el.value);
      state[id].actualQty = val;
      const item = DATA.flatMap(r=>r.items).find(i=>i.id===id);
      state[id].mismatch = (val !== null && item && val !== item.qty);
      saveState();
      render();
      setTimeout(()=>{ const again = document.querySelector(`[data-qty="${id}"]`); if(again) again.focus(); },0);
    };
  });
  main.querySelectorAll('[data-model]').forEach(el=>{
    el.oninput = ()=>{
      const id = el.dataset.model;
      state[id] = state[id] || {};
      state[id].actualModel = el.value;
      saveState();
    };
  });
  main.querySelectorAll('[data-serial]').forEach(el=>{
    el.oninput = ()=>{
      const id = el.dataset.serial;
      state[id] = state[id] || {};
      state[id].actualSerial = el.value;
      saveState();
    };
  });
  main.querySelectorAll('[data-comment]').forEach(el=>{
    el.oninput = ()=>{
      const id = el.dataset.comment;
      state[id] = state[id] || {};
      state[id].comment = el.value;
      saveState();
    };
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('clearBtn').addEventListener('click', ()=>{
  document.getElementById('search').value='';
  render();
  document.getElementById('search').focus();
});
function buildReportLines(){
  const lines = [];
  const statusLabel = {match:'СОВПАДАЕТ', different:'ДРУГОЕ / ЗАМЕНА', missing:'НЕ ПРИЕХАЛО'};
  let checkedCount=0;
  DATA.forEach(room=>{
    const roomLines = [];
    room.items.forEach(it=>{
      const st = state[it.id];
      if(!st || !st.status) return;
      checkedCount++;
      let l = `• ${it.name} — ${statusLabel[st.status]}`;
      if(it.reg) l += ` [${it.reg}]`;
      if(it.serial) l += `\n   Заявлено S/N: ${it.serial}`;
      if(st.status==='different'){
        if(st.actualModel) l += `\n   Фактическая модель: ${st.actualModel}`;
        if(st.actualSerial) l += `\n   Фактический S/N: ${st.actualSerial}`;
      }
      if(st.actualQty!==undefined && st.actualQty!==null && st.actualQty!==it.qty){
        l += `\n   Кол-во: ожидалось ${it.qty} ${it.unit}, по факту ${st.actualQty}`;
      }
      if(st.comment) l += `\n   Комментарий: ${st.comment}`;
      roomLines.push(l);
    });
    if(roomLines.length){
      lines.push(`\n=== ${room.room}${room.date? ' · '+room.date:''} ===`);
      lines.push(...roomLines);
    }
  });
  const header = `ОТЧЁТ ПО СВЕРКЕ ОСНАЩЕНИЯ\nДата: ${new Date().toLocaleDateString('ru-RU')}\nПроверено позиций: ${checkedCount} из ${DATA.reduce((s,r)=>s+r.items.length,0)}\n`;
  return header + lines.join('\n');
}

document.getElementById('reportBtn').addEventListener('click', ()=>{
  const box = document.getElementById('backupBox');
  box.value = buildReportLines();
  box.style.display = 'block';
  box.focus();
  box.select();
  try{
    document.execCommand('copy');
    setSaveStatus('✓ Отчёт скопирован — вставь в заметки, мессенджер или пришли мне для оформления в Word/PDF.', 'ok');
  }catch(e){
    setSaveStatus('Отчёт показан ниже — выдели и скопируй вручную.', '');
  }
});

document.getElementById('printBtn').addEventListener('click', ()=>{
  const statusLabel = {match:'Совпадает', different:'Другое / замена', missing:'Не приехало'};
  const statusCls = {match:'pMatch', different:'pDiff', missing:'pMiss'};
  let html = `<h1 style="font-size:20px;margin-bottom:2px;">Отчёт по сверке оснащения</h1>
    <div style="font-size:12px;color:#555;margin-bottom:10px;">Дата: ${new Date().toLocaleDateString('ru-RU')}</div>`;
  DATA.forEach(room=>{
    const roomItems = room.items.filter(it=>state[it.id] && state[it.id].status);
    if(!roomItems.length) return;
    html += `<h2>${room.room}${room.date? ' · '+room.date:''}</h2>`;
    roomItems.forEach(it=>{
      const st = state[it.id];
      html += `<div class="pItem ${statusCls[st.status]}"><b>${it.name}</b> — ${statusLabel[st.status]}`;
      if(it.reg) html += `<br>Рег: ${it.reg}`;
      if(it.serial) html += `<br>Заявлено S/N: ${it.serial}`;
      if(st.status==='different'){
        if(st.actualModel) html += `<br>Фактическая модель: ${st.actualModel}`;
        if(st.actualSerial) html += `<br>Фактический S/N: ${st.actualSerial}`;
      }
      if(st.actualQty!==undefined && st.actualQty!==null && st.actualQty!==it.qty){
        html += `<br>Кол-во: ожидалось ${it.qty} ${it.unit}, по факту ${st.actualQty}`;
      }
      if(st.comment) html += `<br>Комментарий: ${st.comment}`;
      html += `</div>`;
    });
  });
  document.getElementById('printArea').innerHTML = html;
  window.print();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Сбросить все отметки и введённые количества?')){
    state = {};
    saveState();
    render();
  }
});
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const box = document.getElementById('backupBox');
  box.value = JSON.stringify(state);
  box.style.display = 'block';
  box.focus();
  box.select();
  try{
    document.execCommand('copy');
    setSaveStatus('✓ Код скопирован — вставь его себе в заметки, чтобы восстановить позже.', 'ok');
  }catch(e){
    setSaveStatus('Код показан ниже — выдели и скопируй вручную.', '');
  }
});
document.getElementById('importBtn').addEventListener('click', ()=>{
  const code = prompt('Вставь ранее сохранённый резервный код:');
  if(!code) return;
  try{
    const parsed = JSON.parse(code);
    state = parsed;
    saveState();
    render();
    setSaveStatus('✓ Восстановлено из кода', 'ok');
  }catch(e){
    setSaveStatus('⚠ Код повреждён или неверного формата', 'err');
  }
});

loadState();
</script>
