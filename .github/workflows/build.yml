name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: Лог ошибки сборки ${{ github.run_number }}
          files: build.log
          prerelease: true
          make_latest: false

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk chitalka-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chitalka-apk
          path: chitalka-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: chitalka-${{ github.run_number }}.apk
          make_latest: true
